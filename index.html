<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fitness Log</title>
<meta name="description" content="Osobní deník tréninků a stravy">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness Log">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar" id="topbar">
  <button class="iconbtn topbar-back" data-act="page-back" aria-label="Zpět">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div class="topbar-title" id="topbarTitle">Dnes</div>
  <div class="sync-dot" id="syncDot" title="Stav synchronizace"></div>
</header>

<main id="view" class="view"></main>

<!-- Zamčený timer nad navigací — obsah plní Dock v ui.js -->
<div class="dock" id="dock"></div>

<nav class="bottomnav">
  <button class="navbtn" data-act="nav" data-tab="today">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg>
    <span>Dnes</span>
  </button>
  <button class="navbtn" data-act="nav" data-tab="workout">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
    <span>Trénink</span>
  </button>
  <button class="navbtn" data-act="nav" data-tab="progress">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
    <span>Pokrok</span>
  </button>
  <button class="navbtn" data-act="more-open">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>
    <span>Více</span>
  </button>
</nav>

<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="modal" id="modal"></div>

<div class="toast" id="toast"></div>

<script src="js/util.js"></script>
<script src="js/qr.js"></script>
<script src="js/photos.js"></script>
<script src="js/exercise-db.js"></script>
<script src="js/data.js"></script>
<script src="js/sync.js"></script>
<script src="js/foodapi.js"></script>
<script src="js/ui.js"></script>
<script src="js/view-today.js"></script>
<script src="js/view-workout.js"></script>
<script src="js/view-food.js"></script>
<script src="js/view-summary.js"></script>
<script src="js/view-progress.js"></script>
<script src="js/view-checkin.js"></script>
<script src="js/report.js"></script>
<script src="js/view-menu.js"></script>
<script src="js/app.js"></script>
</body>
</html>
